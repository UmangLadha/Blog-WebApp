<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API_Assignment - API Documentation</title>
    <style>
        body { margin: 0; padding: 0; }
        #opencollection-container { width: 100vw; height: 100vh; }
    </style>
    <link rel="stylesheet" href="https://cdn.opencollection.com/docs.css">
    <script src="https://cdn.opencollection.com/docs.js"></script>
</head>
<body>
    <div id="opencollection-container"></div>
    <script>
        const collectionData = "opencollection: 1.0.0\ninfo:\n  name: API_Assignment\nconfig:\n  environments:\n    - name: QA_Env\n      variables:\n        - name: baseUrl\n          value: https://api.restful-api.dev\nitems:\n  - info:\n      name: get specific id data\n      type: http\n      seq: 4\n    http:\n      method: GET\n      url: '{{baseUrl}}/{{path}}/{{Id}}'\n    runtime:\n      scripts:\n        - type: tests\n          code: |-\n            test(\"Verify Name\", function() {\n              const jsonData = res.getBody();\n              expect(jsonData.name).to.equal(\"Apple MacBook Pro 16\");\n            });\n\n            test(\"Content-Type should be JSON\", function() {\n                expect(res.getHeader('content-type')).to.include('application/json');\n            });\n    settings:\n      encodeUrl: true\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n  - info:\n      name: Fetching All Data\n      type: http\n      seq: 2\n    http:\n      method: GET\n      url: '{{baseUrl}}/{{path}}'\n      body:\n        type: json\n        data: ''\n    runtime:\n      scripts:\n        - type: tests\n          code: |-\n            test(\"Status code 200\", function() {\n              const status = res.getStatus();\n              expect(status).to.equal(200);\n            });\n\n            test(\"Response time less than 2000ms\", function() {\n              expect(res.getResponseTime()).to.be.below(2000);\n            });\n\n            test(\"Verify Name Schema\", function() {\n              const jsonData = res.getBody();\n              expect(jsonData[0].name).to.be.a(\"string\");\n            });\n\n            test(\"Verify ID Schema\", function() {\n              const jsonData = res.getBody();\n              expect(jsonData[0].id).to.be.a(\"string\");\n            });\n\n            test(\"Content-Type should be JSON\", function() {\n                expect(res.getHeader('content-type')).to.include('application/json');\n            });\n    settings:\n      encodeUrl: true\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 2\n  - info:\n      name: Posting the Data\n      type: http\n      seq: 3\n    http:\n      method: POST\n      url: '{{baseUrl}}/{{path}}'\n      headers:\n        - name: Content-Type\n          value: application/json\n      body:\n        type: json\n        data: |-\n          {\n            \"name\": \"Apple MacBook Pro 16\",\n            \"data\": {\n              \"year\": 2019,\n              \"price\": 1849.99,\n              \"color\": \"{{$randomColor}}\",\n              \"CPU model\": \"Intel Core i9\",\n              \"Hard disk size\": \"1 TB\"\n            }\n          }\n    runtime:\n      scripts:\n        - type: tests\n          code: |-\n            test(\"status code 200\", function() {\n              const status = res.getStatus();\n              expect(status).to.equal(200);\n            });\n      actions:\n        - type: set-variable\n          phase: after-response\n          selector:\n            expression: res.body.id\n            method: jsonq\n          variable:\n            name: Id\n            scope: runtime\n    settings:\n      encodeUrl: true\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n  - info:\n      name: updating full object\n      type: http\n      seq: 5\n    http:\n      method: PUT\n      url: '{{baseUrl}}/{{path}}/{{Id}}'\n      headers:\n        - name: Content-Type\n          value: application/json\n      body:\n        type: json\n        data: |-\n          {\n             \"name\": \"Apple MacBook Pro 20\",\n             \"data\": {\n                \"year\": 2020,\n                \"price\": 2149.99,\n                \"CPU model\": \"Intel Core i99\",\n                \"Hard disk size\": \"4 TB\",\n                \"color\": \"gold\"\n             }\n          }\n      auth: inherit\n    settings:\n      encodeUrl: true\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n  - info:\n      name: Updating Specific user data\n      type: http\n      seq: 6\n    http:\n      method: PATCH\n      url: '{{baseUrl}}/{{path}}/{{Id}}'\n      headers:\n        - name: ''\n          value: ''\n      body:\n        type: json\n        data: |-\n          {\n            \"data\": {\n              \"price\": 2249.99,\n              \"color\": \"{{$randomColor}}\",\n              \"capacity\": \"256GB\"\n            }\n          }\n      auth: inherit\n    settings:\n      encodeUrl: true\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n  - info:\n      name: Deleteing the specific user\n      type: http\n      seq: 7\n    http:\n      method: DELETE\n      url: '{{baseUrl}}/{{path}}/{{Id}}'\n      auth: inherit\n    settings:\n      encodeUrl: true\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\n  - info:\n      name: Creating Invalid data request\n      type: http\n      seq: 8\n    http:\n      method: POST\n      url: '{{baseUrl}}/{{path}}'\n      body:\n        type: json\n        data: ''\n      auth: inherit\n    runtime:\n      scripts:\n        - type: tests\n          code: |-\n            test(\"Should return error for bad Request\", function() {\n              expect(res.getStatus()).to.be.equal(400);\n            });\n    settings:\n      encodeUrl: true\n      timeout: 0\n      followRedirects: true\n      maxRedirects: 5\nrequest:\n  auth:\n    type: bearer\n    token: ''\n  variables:\n    - name: baseUrl\n      value: https://api.restful-api.dev\n    - name: path\n      value: objects\nbundled: true\nextensions:\n  bruno:\n    ignore:\n      - node_modules\n      - .git\n    exportedAt: '2026-02-06T18:10:31.687Z'\n    exportedUsing: Bruno/3.0.2\n";
        new window.OpenCollection({
            target: document.getElementById('opencollection-container'),
            opencollection: collectionData,
            theme: 'light'
        });
    </script>
</body>
</html>
